version: '3.9'

services:
  prometheus:
    image: prom/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana
    ports:
      - '3005:3000'

  tempo:
    image: grafana/tempo
    ports:
      - '3200:3200'

  loki:
    image: grafana/loki
    ports:
      - '3100:3100'

  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - '16686:16686'
