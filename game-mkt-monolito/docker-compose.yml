version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: game-mkt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_mkt
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-mkt-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: game-mkt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-mkt-network

  # NATS Event Bus
  nats:
    image: nats:2.10-alpine
    container_name: game-mkt-nats
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    command: -js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-mkt-network

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: game-mkt-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14268/api/traces"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-mkt-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game-mkt-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_mkt
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      OTEL_JAEGER_AGENT_HOST: jaeger
      OTEL_JAEGER_AGENT_PORT: 6831
      JOHN_BASE_URL: http://john-brasileiro:8000
      CEFEIDA_BASE_URL: http://cefeida:8000
      ARCHIMEDES_BASE_URL: http://archimedes:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-mkt-network
    restart: unless-stopped

  # Frontend (optional, for development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game-mkt-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - game-mkt-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  game-mkt-network:
    driver: bridge
